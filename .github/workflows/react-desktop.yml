name: ZuzuCord React Windows Desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop-react/**'
      - '.github/workflows/react-desktop.yml'
  pull_request:
    paths:
      - 'desktop-react/**'
      - '.github/workflows/react-desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
# Prevent simultaneous builds from publishing an older release as GitHub's
# 'latest' after a newer version was already uploaded.
concurrency:
  group: zuzucord-windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build React Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: desktop-react
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Test v-prefixed release policy
        working-directory: desktop-react
        run: node --test electron/versions.test.cjs electron/update-policy.test.cjs
      - name: Set unique self-update version
        working-directory: desktop-react
        shell: pwsh
        run: |
          $version = "0.11.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          $tag = "v$version"
          Set-Content -Path electron/release.json -Value ('{"tag":"' + $tag + '"}') -NoNewline
      - name: Typecheck, bundle and package React Windows client
        working-directory: desktop-react
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Verify React installer and portable archive
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop-react/release -File -ErrorAction Stop)
          $exe = @($files | Where-Object { $_.Name -like '*.exe' })
          $zip = @($files | Where-Object { $_.Name -like '*.zip' })
          $meta = @($files | Where-Object { $_.Name -eq 'latest.yml' })
          $blockmaps = @($files | Where-Object { $_.Name -like '*.exe.blockmap' })
          if ($exe.Count -ne 1 -or $zip.Count -ne 1 -or $meta.Count -ne 1 -or $blockmaps.Count -ne 1) {
            throw 'Auto-update requires one installer, one ZIP, latest.yml and an EXE blockmap.'
          }
          $expected = 'version: 0.11.${{ github.run_number }}'
          if (-not ((Get-Content desktop-react/release/latest.yml -Raw).Contains($expected))) {
            throw 'Auto-update manifest version does not match the packaged application.'
          }
          foreach ($file in @($exe + $zip)) {
            if ($file.Length -lt 1000000) { throw ('Unexpectedly small asset: '+$file.Name) }
            Write-Host ('Built: '+$file.Name+' ('+$file.Length+' bytes)')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ZuzuCord-React-Windows
          path: |
            desktop-react/release/*.exe
            desktop-react/release/*.zip
            desktop-react/release/latest.yml
            desktop-react/release/*.blockmap
          if-no-files-found: error
          retention-days: 30
      - name: Publish React desktop preview release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.11.${{ github.run_number }}"
          gh release create $tag desktop-react/release/*.exe desktop-react/release/*.zip desktop-react/release/latest.yml desktop-react/release/*.exe.blockmap --target main --latest --title "ZuzuCord $tag — Auto-update" --notes "ZuzuCord installed Windows app with automatic update checking, SHA-512-verified background downloads and installation on close or Restart & update. The first installation still uses the NSIS setup EXE; subsequent updates do not require manual installer downloads. Includes Crystals, custom roles and community tools. Preview build is unsigned; code signing and real two-version Windows update testing are required before broad distribution."
