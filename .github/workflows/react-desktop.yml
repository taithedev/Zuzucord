name: ZuzuCord React Windows Desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop-react/**'
      - '.github/workflows/react-desktop.yml'
  pull_request:
    paths:
      - 'desktop-react/**'
      - '.github/workflows/react-desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build React Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: desktop-react
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Typecheck, bundle and package React Windows client
        working-directory: desktop-react
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Verify React installer and portable archive
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop-react/release -File -ErrorAction Stop)
          $exe = @($files | Where-Object { $_.Name -like '*.exe' })
          $zip = @($files | Where-Object { $_.Name -like '*.zip' })
          if ($exe.Count -lt 1 -or $zip.Count -lt 1) { throw 'Missing installer or ZIP after electron-builder' }
          foreach ($file in @($exe + $zip)) {
            if ($file.Length -lt 1000000) { throw ('Unexpectedly small asset: '+$file.Name) }
            Write-Host ('Built: '+$file.Name+' ('+$file.Length+' bytes)')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ZuzuCord-React-Windows
          path: |
            desktop-react/release/*.exe
            desktop-react/release/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish React desktop preview release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.7.0-react.${{ github.run_number }}"
          gh release create $tag desktop-react/release/*.exe desktop-react/release/*.zip --target main --prerelease --title "ZuzuCord React Desktop Preview #${{ github.run_number }}" --notes "Windows-native packaged React/TypeScript client with OLED/gradient personalization, three-rail community UI and existing Supabase accounts, servers, friends, DMs and ZuzuBot. Unsigned preview build: verify Windows runtime compatibility before broad release. The legacy C# application remains in src/ZuzuCord."
