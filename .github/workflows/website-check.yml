name: Validate ZuzuCord Website
on:
  push:
    branches: [main, beta-website]
    paths:
      - 'website/**'
      - 'beta-website/**'
      - 'zuzucorddevportal/**'
      - '.github/workflows/website-check.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'beta-website/**'
      - 'zuzucorddevportal/**'
      - '.github/workflows/website-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check website/app.js
          node --check website/sync.js
          node --check beta-website/app.js
          node --check beta-website/sync.js
          node --check zuzucorddevportal/app.js
      - name: Exercise beta synchronization and Supabase counters
        run: |
          node --test beta-website/sync.smoke.test.mjs
          node --test website/community-stats.smoke.test.mjs
      - name: Validate website bundle paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths=[]
              def handle_starttag(self,tag,attrs):
                  data=dict(attrs)
                  for attr in ('src','href'):
                      val=data.get(attr,'')
                      if val.startswith('./'): self.paths.append(val)
          for root in (Path('website'), Path('beta-website'), Path('zuzucorddevportal')):
              files=[root/'index.html']
              if root.name!='zuzucorddevportal':
                  files.extend([root/'privacy.html',root/'terms.html',root/'sync.html'])
              for document in files:
                  parser=Assets()
                  parser.feed(document.read_text())
                  missing=[p for p in parser.paths if not (root/p[2:]).exists()]
                  if missing: raise SystemExit('Missing assets in '+str(document)+': '+str(missing))
                  print(document,'validated',len(parser.paths),'asset references')
          sync=(Path('beta-website')/'sync.js').read_text()
          for term in ('zuzucord_is_beta_tester','zuzucord_beta_sync','access_token'):
              if term not in sync: raise SystemExit('Missing beta auth behavior: '+term)
          if 'localStorage' in sync or 'sessionStorage' in sync:
              raise SystemExit('Beta authentication must remain in memory only')
          prod=(Path('website')/'sync.js').read_text()
          if 'zuzucord_user_sync' not in prod or 'zuzucord_is_beta_tester' in prod:
              raise SystemExit('Production app sync must work without beta tester approval')
          if 'localStorage' in prod or 'sessionStorage' in prod:
              raise SystemExit('Website authentication must stay in memory only')
          portal=(Path('zuzucorddevportal')/'app.js').read_text()
          if 'zuzucord_has_role' not in portal or 'zuzucord-bot-api' not in portal:
              raise SystemExit('Developer portal must validate roles and use server-issued bot tokens')
          PY
