name: ZuzuCord V2 Windows Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile ZuzuCord V2
        run: dotnet build src/ZuzuCord/ZuzuCord.csproj --configuration Release
      - name: Publish standalone Windows app
        run: dotnet publish src/ZuzuCord/ZuzuCord.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output dist/windows
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/windows/ZuzuCord.exe")) { throw "ZuzuCord.exe was not produced" }
          if ((Get-Item "dist/windows/ZuzuCord.exe").Length -lt 100000) { throw "Unexpectedly small build" }
      - uses: actions/upload-artifact@v4
        with:
          name: ZuzuCord-V2-Windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
      - name: Package public preview ZIP
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath dist/ZuzuCordV2-win-x64.zip -Force
      - name: Publish public preview release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.0-preview.${{ github.run_number }}"
          gh release create $tag dist/ZuzuCordV2-win-x64.zip --target main --prerelease --title "ZuzuCord V2 Preview #${{ github.run_number }}" --notes "Unsigned Windows x64 preview. Download the ZIP, extract it, and run ZuzuCord.exe. This version includes account authentication, public chat rooms, and the new native interface. Preview software may still contain issues."

